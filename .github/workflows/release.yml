name: Release ScyllaDB Java Driver

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: skip project tests; release helper tests always run'
        default: false

      target-tag:
        type: string
        description: 'target-tag: scylla-3.x, or a tag whose preceding commit passes release credential safety checks. Other branches and unsafe historical targets are unsupported.'
        default: scylla-3.x

      skip-integration-matrix:
        type: boolean
        description: 'skip-integration-matrix: do not run the driver matrix integration tests before releasing'
        default: false
      release-version:
        type: string
        required: false
        description: 'Optional four-component 3.x release version override'

env:
  RELEASE_MAJOR: '3'
  RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
  RELEASE_VERSION: ${{ inputs.release-version }}

# Serialize each release branch; the two driver lines can validate independently.
concurrency:
  group: java-driver-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/target.py blockers

      - name: Set up validation Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: temurin

      - name: Validate release tooling
        run: |
          python3 scripts/release/guard.py check
          python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Preserve validation guard
        run: |
          mkdir -p "$RUNNER_TEMP/release-safety"
          cp scripts/release/*.py scripts/release/publisher.asc Makefile "$RUNNER_TEMP/release-safety/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-safety/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Resolve release commit and version
        id: target
        run: python3 "$RUNNER_TEMP/release-safety/target.py" resolve

      - name: Validate target without release credentials
        env:
          RELEASE_TARGET_COMMIT: ${{ steps.target.outputs.ref }}
          RELEASE_VERSION: ${{ steps.target.outputs.version }}
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          python3 "$RUNNER_TEMP/release-safety/target.py" checkout
          python3 "$RELEASE_GUARD" check
          if [[ "$RELEASE_SKIP_TESTS" == true ]]; then
            export MAVEN_OPTS="${MAVEN_OPTS:-} -DskipTests=true -DskipITs=true"
          fi
          python3 "$RELEASE_GUARD" run mvn -B --no-transfer-progress versions:set "-DnewVersion=$RELEASE_VERSION" -DgenerateBackupPoms=false
          python3 "$RELEASE_GUARD" run mvn -B --no-transfer-progress -Prelease -Dgpg.skip=true verify

      - name: Upload sanitized validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-maven-logs
          path: ${{ runner.temp }}/release-logs/*.log
          if-no-files-found: ignore

  pre-release-integration:
    name: Pre-release integration matrix
    needs: validate
    if: inputs.skip-integration-matrix == false
    permissions:
      contents: read
    uses: scylladb/scylla-java-driver-matrix/.github/workflows/driver-integration-matrix.yml@master
    with:
      run_apache: false
      driver_ref: ${{ needs.validate.outputs.ref }}
      driver_version: ${{ needs.validate.outputs.version }}

  release:
    name: Release
    needs: [validate, pre-release-integration]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.pre-release-integration.result == 'success' || (inputs.skip-integration-matrix && needs.pre-release-integration.result == 'skipped')) }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      issues: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Checkout workflow launch source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preserve release guard
        run: |
          mkdir -p "$RUNNER_TEMP/release-safety"
          cp scripts/release/*.py scripts/release/publisher.asc Makefile "$RUNNER_TEMP/release-safety/"
          echo "RELEASE_GUARD=$RUNNER_TEMP/release-safety/guard.py" >> "$GITHUB_ENV"
          echo "RELEASE_LOG_DIR=$RUNNER_TEMP/release-logs" >> "$GITHUB_ENV"

      - name: Checkout release target
        env:
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.ref }}
        run: python3 "$RUNNER_TEMP/release-safety/target.py" checkout

      - name: Check release credential safety before importing credentials
        run: python3 "$RUNNER_TEMP/release-safety/guard.py" check

      - name: Check Central credentials before release preparation
        env:
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: python3 "$RUNNER_TEMP/release-safety/target.py" preflight

      - name: Set up publishing Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: temurin
          server-id: central
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD

      - name: Stamp README with the effective release version
        run: python3 "$RUNNER_TEMP/release-safety/target.py" stamp-readme

      - name: Prepare release
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: |
          baseline=$(git rev-parse HEAD)
          export RELEASE_BASE_COMMIT="$baseline"
          echo "RELEASE_BASE_COMMIT=$baseline" >> "$GITHUB_ENV"
          make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release-prepare

      - name: Verify prepared release commits and tag with public key only
        run: python3 "$RUNNER_TEMP/release-safety/signing.py" verify-prepared

      - name: Preserve prepared release history for recovery
        run: |
          git bundle create "$RUNNER_TEMP/prepared-release.bundle" HEAD "refs/tags/$RELEASE_VERSION" "^$RELEASE_BASE_COMMIT"

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-safety/target.py" blockers

      - name: Recheck release branch before publication
        if: inputs.target-tag == 'scylla-3.x'
        env:
          RELEASE_TARGET_COMMIT: ${{ needs.validate.outputs.ref }}
        run: python3 "$RUNNER_TEMP/release-safety/target.py" check-branch

      - name: Perform release
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release

      - name: Perform release dry-run
        if: inputs.dry-run == true
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
          RELEASE_SKIP_TESTS: 'true'
        run: make -f "$RUNNER_TEMP/release-safety/Makefile" RELEASE_GUARD="$RUNNER_TEMP/release-safety/guard.py" release-dry-run

      - name: Upload verified dry-run bundle
        if: inputs.dry-run == true && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-central-bundle
          path: target/checkout/**/target/central-publishing/central-bundle.zip
          if-no-files-found: error

      - name: Push changes to SCM
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'scylla-3.x' }}
        run: git push origin --follow-tags -v HEAD:refs/heads/scylla-3.x

      - name: Publish immutable GitHub Release for the verified signed tag
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'scylla-3.x' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
        run: python3 "$RUNNER_TEMP/release-safety/github_release.py"

      - name: Upload prepared release recovery state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prepared-release-state
          path: |
            ${{ runner.temp }}/prepared-release.bundle
            ${{ runner.temp }}/release-safety/publisher.asc
          if-no-files-found: ignore

      - name: Upload sanitized release logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-logs
          path: ${{ runner.temp }}/release-logs/*.log
          if-no-files-found: ignore

  publish-docs:
    name: Publish docs
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.dry-run == false && inputs.target-tag == 'scylla-3.x' }}
    uses: ./.github/workflows/docs-pages.yml
    permissions:
      contents: write
