name: Release ScyllaDB Java Driver

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: do not run tests while releasing'
        default: false

      target-tag:
        type: string
        description: 'target-tag: tag or branch name to release. Use to re-release tagged releases'
        default: scylla-3.x

      skip-integration-matrix:
        type: boolean
        description: 'skip-integration-matrix: do not run the driver matrix integration tests before releasing'
        default: false

jobs:
  release-target:
    name: Resolve release target
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: read

    outputs:
      ref: ${{ steps.target.outputs.ref }}
      version: ${{ steps.target.outputs.version }}

    steps:
      - name: Check for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label release-blocker \
              --limit 1 \
              --json title,url \
              --jq '.[0] | select(.) | "\(.url) — \(.title)"'
          )"
          if [[ -n "$blocker" ]]; then
            echo "::error::Release blocked by open issue: $blocker"
            exit 1
          fi
          echo "No open release blockers."

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The commit release:prepare starts from, and the version it will tag: HEAD, or one commit
      # before target-tag for a re-release, as make checkout-one-commit-before does.
      - name: Resolve release commit and version
        id: target
        env:
          TARGET_TAG: ${{ inputs.target-tag }}
        run: |
          set -euo pipefail
          ref="$GITHUB_SHA"
          if [[ "$TARGET_TAG" == 3.* ]]; then
            ref="$(git rev-parse "refs/tags/$TARGET_TAG~1")"
          fi
          version="$(git show "$ref:pom.xml" | python3 -c 'import sys, xml.etree.ElementTree as ET; print(ET.parse(sys.stdin).getroot().findtext("{http://maven.apache.org/POM/4.0.0}version"))')"
          version="${version%-SNAPSHOT}"
          if [[ ! "$version" =~ ^3\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release version '$version' at $ref"
            exit 1
          fi
          if [[ "$TARGET_TAG" == 3.* && "$version" != "$TARGET_TAG" ]]; then
            echo "::error::$TARGET_TAG~1 would release $version, not $TARGET_TAG"
            exit 1
          fi
          echo "Releasing $version from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip integration matrix
        if: inputs.skip-integration-matrix == true
        run: echo "::warning::Pre-release integration matrix skipped"

  # The driver matrix patches and tests every release, and a release that breaks it used to
  # surface only in the nightly Jenkins run, after it was public (4.19.2.2). This runs the full
  # Scylla matrix from matrix master on the commit about to be released, selecting patches as
  # if it were already tagged with the release version. If it fails, fix the matrix (for
  # example, add versions/scylla/<version>), merge that, and re-dispatch.
  pre-release-integration:
    name: Pre-release integration matrix
    needs: release-target
    if: inputs.skip-integration-matrix == false
    permissions:
      contents: read
    uses: scylladb/scylla-java-driver-matrix/.github/workflows/driver-integration-matrix.yml@master
    with:
      run_apache: false
      driver_ref: ${{ needs.release-target.outputs.ref }}
      driver_version: ${{ needs.release-target.outputs.version }}

  release:
    name: Release
    needs: [release-target, pre-release-integration]
    if: ${{ !cancelled() && needs.release-target.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.pre-release-integration.result) }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: read

    env:
      MVNCMD: mvn -B -X -ntp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout Code One Commit Before ${{ inputs.target-tag }}
        if: inputs.target-tag != 'scylla-3.x'
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: make checkout-one-commit-before

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD
          cache: maven

      - name: Configure Git user
        run: |
          git config user.name "ScyllaDB Promoter"
          git config user.email "github-promoter@scylladb.com"

      # The release plugin rewrites only poms, so the README's version went stale between
      # releases. Its commit takes the whole index, so a README staged here lands in the
      # "prepare release" commit and the tag; release-prepare tolerates it via
      # checkModificationExcludeList.
      - name: Stamp the README with the release version
        run: |
          set -euo pipefail
          version="$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)"
          version="${version%-SNAPSHOT}"
          line="${version%.*}"
          sed -i -E "s/${line//./\\.}\.[0-9]+/${version}/g" README.md
          if ! grep -qF "$version" README.md; then
            echo "::error::README.md does not name $version after stamping; update this step"
            exit 1
          fi
          git add README.md
          git diff --cached --stat

      - name: Prepare release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
        run: |
          make release-prepare

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --label release-blocker \
              --limit 1 \
              --json title,url \
              --jq '.[0] | select(.) | "\(.url) — \(.title)"'
          )"
          if [[ -n "$blocker" ]]; then
            echo "::error::Release blocked by open issue: $blocker"
            exit 1
          fi
          echo "No open release blockers."

      - name: Perform release
        if: inputs.dry-run == false
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: make release

      - name: Perform release dry-run
        if: inputs.dry-run == true
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: make release-dry-run

      - name: Upload release logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: /tmp/java-driver-release-logs/*.log

      - name: Push changes to SCM
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'scylla-3.x' }}
        run: |
          git status && git log -3
          git push origin --follow-tags -v

  publish-docs:
    name: Publish docs
    needs: release
    # Without !cancelled(), a skipped pre-release-integration would skip this job too.
    if: ${{ !cancelled() && needs.release.result == 'success' && inputs.dry-run == false && inputs.target-tag == 'scylla-3.x' }}
    # The release push uses the workflow token, which starts no workflow.
    uses: ./.github/workflows/docs-pages.yml
    permissions:
      contents: write
