name: Release ScyllaDB Java Driver

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: run without pushing SCM changes to upstream'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: do not run tests while releasing'
        default: false

      target-tag:
        type: string
        description: 'target-tag: tag or branch name to release. Use to re-release tagged releases'
        default: scylla-4.x

      matrix-branch:
        type: string
        description: 'matrix-branch: scylla-java-driver-matrix branch to use for patch validation'
        default: master

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      MVNCMD: mvn -B -X -ntp

    steps:
      - name: Checkout Repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Checkout Code One Commit Before ${{ inputs.target-tag }}
        if: inputs.target-tag != 'scylla-4.x'
        env:
          RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
        run: make checkout-one-commit-before

      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '11'
          distribution: 'temurin'
          server-id: central
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          server-username: SONATYPE_TOKEN_USERNAME
          server-password: SONATYPE_TOKEN_PASSWORD
          cache: maven

      - name: Configure Git user
        run: |
          git config user.name "ScyllaDB Promoter"
          git config user.email "github-promoter@scylladb.com"

      - name: Prepare release
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
        run: make release-prepare

      - name: Validate matrix patches
        run: |
          RELEASE_TAG=$(grep '^scm.tag=' release.properties | cut -d= -f2)
          echo "Release tag: ${RELEASE_TAG}"

          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "::error::Could not determine release tag from release.properties"
            exit 1
          fi

          git clone --depth 1 --branch "${{ inputs.matrix-branch }}" \
            https://github.com/scylladb/scylla-java-driver-matrix.git /tmp/matrix

          pip install --quiet -r /tmp/matrix/scripts/requirements.txt

          echo "=== Validating scylla driver patches for ${RELEASE_TAG} ==="
          python3 /tmp/matrix/main.py . \
            --versions "${RELEASE_TAG}" \
            --driver-type scylla \
            --patch-only

          echo "Matrix patches apply cleanly to ${RELEASE_TAG}"

      - name: Perform release
        if: inputs.dry-run == false
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: make release

      - name: Perform release dry-run
        if: inputs.dry-run == true
        env:
          RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          SONATYPE_TOKEN_USERNAME: ${{ secrets.SONATYPE_TOKEN_USERNAME }}
          SONATYPE_TOKEN_PASSWORD: ${{ secrets.SONATYPE_TOKEN_PASSWORD }}
        run: make release-dry-run

      - name: Upload release logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maven-stdout
          path: /tmp/java-driver-release-logs/*.log

      - name: Push changes to SCM
        if: ${{ inputs.dry-run == false && inputs.target-tag == 'scylla-4.x' }}
        run: |
          git status && git log -3
          git push origin --follow-tags -v
