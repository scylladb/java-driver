name: Release credential safety

on:
  workflow_call:
    inputs:
      test-ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  release-credential-safety:
    name: Release credential safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.test-ref || github.sha }}
          persist-credentials: false
      - run: python3 scripts/release/guard.py check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
