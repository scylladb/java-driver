name: Release credential safety

on:
  pull_request:
  push:
    branches: [scylla-4.x]

permissions:
  contents: read

jobs:
  release-credential-safety:
    name: Release credential safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - run: python3 scripts/release/guard.py check
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
