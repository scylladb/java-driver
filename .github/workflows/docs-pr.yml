name: "Docs / Build PR"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

permissions:
  contents: read

on:
  pull_request:
    branches:
    - scylla-4.x
    paths:
    - 'docs/**'
    - '.github/workflows/docs-*.yml'
    - 'faq/**'
    - 'manual/**'
    - 'changelog/**'
    - 'upgrade_guide/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      # The docs publish never runs before merge, so the guard that protects it has
      # no other pre-merge coverage. Seconds, and no build setup needed.
      - name: Check the javadoc guard
        run: ./docs/_utils/check-javadoc-output-test.sh

      - name: Check the release-tag aliases
        run: python3 docs/_utils/alias-tags-test.py

      - name: Set up JDK 11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up env
        run: make -C docs setupenv

      - name: Check redirects
        run: make -C docs check-redirects

      - name: Build docs
        id: docs-build
        shell: bash
        run: |
          make -C docs test SPHINXOPTS="-j auto -w $RUNNER_TEMP/docs-warnings.log" \
            2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      - name: Summarize docs diagnostics
        if: always()
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@ee13c40833531a57be3f4926d1f58cab1927817e
        with:
          build-outcome: ${{ steps.docs-build.outcome }}
