name: "Docs / Build PR"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

permissions:
  contents: read

on:
  pull_request:
    branches:
    - scylla-4.x
    paths:
    - 'docs/**'
    - '.github/workflows/docs-*.yml'
    - 'faq/**'
    - 'manual/**'
    - 'changelog/**'
    - 'upgrade_guide/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      # The docs publish never runs before merge, so the guard that protects it has
      # no other pre-merge coverage. Seconds, and no build setup needed.
      - name: Check the javadoc guard
        run: ./docs/_utils/check-javadoc-output-test.sh

      - name: Check the release-tag aliases
        run: python3 docs/_utils/alias-tags-test.py

      - name: Set up JDK 11
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Set up env
        run: make -C docs setupenv

      - name: Check redirects
        run: make -C docs check-redirects

      - name: Build docs
        id: docs-build
        shell: bash
        run: |
          make -C docs test SPHINXOPTS="-j auto -w $RUNNER_TEMP/docs-warnings.log" \
            2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      - name: Summarize docs diagnostics
        if: always()
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@0d821fc4038ee9ad6363362c02035132489bf3f6
        with:
          build-outcome: ${{ steps.docs-build.outcome }}
