name: "Docs / Publish"
# For more information,
# see https://sphinx-theme.scylladb.com/stable/deployment/production.html#available-workflows

on:
  push:
    branches:
    - scylla-4.x
    - 'scylla-**'
    paths:
    - 'docs/**'
    - 'faq/**'
    - 'manual/**'
    - 'changelog/**'
    - 'upgrade_guide/**'
  workflow_dispatch:
  workflow_call:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      MAVEN_VERSION: '3.9.16'
    concurrency:
      group: single
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Set up JDK 8 and 11
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: |
            8
            11
          distribution: 'temurin'

      - name: Install Maven
        run: |
          maven_archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          maven_url="https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries"
          curl --fail --location --retry 3 --output "$maven_archive" \
            "$maven_url/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          maven_sha512=831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0caf
          maven_sha512+=b8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
          printf '%s  %s\n' "$maven_sha512" "$maven_archive" | sha512sum --check
          tar -xzf "$maven_archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Verify Maven version
        run: mvn -version | grep -F "Apache Maven $MAVEN_VERSION"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Set up env
        run: make -C docs setupenv

      - name: Build redirects
        run: make -C docs redirects

      - name: Build docs
        run: make -C docs multiversion

      # deploy.sh rebuilds gh-pages from this run's output and force-pushes, so a
      # version that built no api/ has its live one deleted rather than left stale.
      # Record that before deploying and fail the job after, so the versions that did
      # build still publish while the loss is still loud. A total loss stops here
      # instead: there would be nothing left to publish.
      - name: Check javadoc output
        id: javadoc-check
        run: ./docs/_utils/check-javadoc-output.sh

      - name: Deploy docs to GitHub Pages
        run: ./docs/_utils/deploy.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any version lost content
        if: steps.javadoc-check.outputs.not-built != '' || steps.javadoc-check.outputs.missing-api != ''
        env:
          NOT_BUILT: ${{ steps.javadoc-check.outputs.not-built }}
          MISSING_API: ${{ steps.javadoc-check.outputs.missing-api }}
        run: |
          # A version that never built is gone from the site entirely, which is a
          # different loss from one that published without its javadoc.
          [ -z "$NOT_BUILT" ] || echo "::error::Not built, now removed from the site entirely: $NOT_BUILT"
          [ -z "$MISSING_API" ] || echo "::error::Published without javadoc, their /api/ is now gone from the site: $MISSING_API"
          exit 1
