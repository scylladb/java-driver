name: 'Tests (Driver 4.x)'

on:
  push:
    branches: [ scylla-4.*x ]
    paths-ignore:
      - "docs/**"
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs-pr.yml
      - .github/workflows/release.yml
      - "*.md"
      - "*.sh"
      - "renovate.json"
      - ".snyk"
      - ".gitignore"
  pull_request:
    branches: [ scylla-4.*x ]
    paths-ignore:
      - "docs/**"
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs-pr.yml
      - .github/workflows/release.yml
      - "*.md"
      - "*.sh"
      - "renovate.json"
      - ".snyk"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        java-version: [11, 17]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Get POM hash
        id: get-pom-hash
        run: echo "value=${{ hashFiles('**/pom.xml') }}" >> "$GITHUB_OUTPUT"

      - name: Restore maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: java-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ steps.get-pom-hash.outputs.value }}

      - name: Compile source and tests
        run: make compile-all

      - name: Download test dependencies
        if: steps.java-cache.outputs.cache-hit != 'true'
        run: make download-all-dependencies

      - name: Save maven repository cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.java-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ steps.get-pom-hash.outputs.value }}

  verify:
    name: Full verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        java-version: [11, 17]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Full verify
        run: make check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        java-version: [11, 17]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Run unit tests
        env:
          COVERAGE: "true"
        run: make test-unit

      # Flattened to one file per module so the artifact layout does not depend
      # on how many modules happened to produce data, and named per lane so the
      # aggregating job can keep each lane's contribution apart.
      - name: Collect coverage execution data
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          mkdir -p coverage-exec
          for exec_file in */target/jacoco.exec metrics/*/target/jacoco.exec; do
            module="${exec_file%/target/jacoco.exec}"
            cp "$exec_file" "coverage-exec/${module//\//-}.exec"
          done
          ls -l coverage-exec

      - name: Upload coverage execution data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-exec-unit-${{ matrix.java-version }}
          path: coverage-exec/
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: test-results-${{ matrix.java-version }}
          path: "*/**/target/*-reports/*.xml"

      - name: Parse test results
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: always()
        with:
          check_name: Unit tests report (JDK ${{ matrix.java-version }})
          require_tests: true
          report_paths: "*/**/target/*-reports/TEST-*.xml"
          follow_symlink: true
          detailed_summary: true
          updateComment: false
          skip_annotations: true

  setup-integration-tests:
    name: Setup ITs
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

  cassandra-integration-tests:
    name: Cassandra ITs
    runs-on: ubuntu-latest
    needs: [setup-integration-tests]
    timeout-minutes: 90

    strategy:
      matrix:
        cassandra-version: [3-LATEST, 4-LATEST]
        java-version: [11, 17]
        test-group: [parallelizable, serial, isolated]
        exclude:
          - cassandra-version: 3-LATEST
            java-version: 17
          - cassandra-version: 4-LATEST
            java-version: 11
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Setup Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Setup environment
        run: make install-cassandra-ccm

      - name: Get cassandra version
        id: cassandra-version
        env:
          CASSANDRA_VERSION: ${{ matrix.cassandra-version }}
          GET_VERSION_VERSION: 0.4.5
          GH_TOKEN: ${{ github.token }}
        run: make resolve-cassandra-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ccm-cache
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ steps.cassandra-version.outputs.value }}

      - name: Download Cassandra (${{ steps.cassandra-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        env:
          CASSANDRA_VERSION_RESOLVED: ${{ steps.cassandra-version.outputs.value }}
          GET_VERSION_VERSION: 0.4.5
        run: make download-cassandra

      - name: Save CCM image into the cache
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ steps.cassandra-version.outputs.value }}

      - name: Determine test skip args
        id: test-skip-args
        run: |
          case "${{ matrix.test-group }}" in
            parallelizable) echo "value=-DskipSerialITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            serial)         echo "value=-DskipParallelizableITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            isolated)       echo "value=-DskipParallelizableITs=true -DskipSerialITs=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run integration tests on Cassandra (${{ steps.cassandra-version.outputs.value }}) - ${{ matrix.test-group }}
        id: run-integration-tests
        env:
          CASSANDRA_VERSION: ${{ matrix.cassandra-version }}
          CASSANDRA_VERSION_RESOLVED: ${{ steps.cassandra-version.outputs.value }}
          GET_VERSION_VERSION: 0.4.5
          GH_TOKEN: ${{ github.token }}
          MAVEN_EXTRA_ARGS: ${{ steps.test-skip-args.outputs.value }}
          COVERAGE: "true"
        run: make test-integration-cassandra

      - name: Collect coverage execution data
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          mkdir -p coverage-exec
          for exec_file in */target/jacoco.exec metrics/*/target/jacoco.exec; do
            module="${exec_file%/target/jacoco.exec}"
            cp "$exec_file" "coverage-exec/${module//\//-}.exec"
          done
          ls -l coverage-exec

      - name: Upload coverage execution data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-exec-cassandra-${{ matrix.cassandra-version }}-${{ matrix.java-version }}-${{ matrix.test-group }}
          path: coverage-exec/
          if-no-files-found: warn

      - name: Upload test results
        if: failure() && steps.run-integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.java-version }}-${{ matrix.cassandra-version }}-${{ matrix.test-group }}
          path: "*/**/target/*-reports/*.xml"

      - name: Upload CCM logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ccm-log-cassandra-${{ matrix.java-version }}-${{ matrix.cassandra-version }}-${{ matrix.test-group }}
          path: /tmp/ccm*/ccm*/node*/logs/*

      - name: Parse test results
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: always()
        with:
          check_name: Integration tests report for Cassandra ${{ steps.cassandra-version.outputs.value }} (${{ matrix.test-group }}, JDK ${{ matrix.java-version }})
          require_tests: true
          report_paths: "*/**/target/*-reports/TEST-*.xml"
          follow_symlink: true
          detailed_summary: true
          updateComment: false
          skip_annotations: true

  scylla-integration-tests:
    name: Scylla ITs
    runs-on: ubuntu-latest
    needs: [setup-integration-tests]
    timeout-minutes: 90

    strategy:
      matrix:
        scylla-version: [LTS-LATEST, LTS-PRIOR, LATEST]
        java-version: [11, 17]
        test-group: [parallelizable, serial, isolated]
        exclude:
          - scylla-version: LTS-PRIOR
            java-version: 17
          - scylla-version: LTS-LATEST
            java-version: 17
          - scylla-version: LATEST
            java-version: 11
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Setup Python 3
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install CCM
        run: make install-scylla-ccm

      - name: Get scylla version
        id: scylla-version
        env:
          SCYLLA_VERSION: ${{ matrix.scylla-version }}
          GH_TOKEN: ${{ github.token }}
        run: make resolve-scylla-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: ccm-cache
        with:
          path: ~/.ccm/scylla-repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Download Scylla (${{ steps.scylla-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        env:
          SCYLLA_VERSION_RESOLVED: ${{ steps.scylla-version.outputs.value }}
        run: make download-scylla

      - name: Save CCM image into the cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.ccm/scylla-repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Determine test skip args
        id: test-skip-args
        run: |
          case "${{ matrix.test-group }}" in
            parallelizable) echo "value=-DskipSerialITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            serial)         echo "value=-DskipParallelizableITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            isolated)       echo "value=-DskipParallelizableITs=true -DskipSerialITs=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run integration tests on Scylla (${{ steps.scylla-version.outputs.value }}) - ${{ matrix.test-group }}
        id: run-integration-tests
        env:
          SCYLLA_VERSION_RESOLVED: ${{ steps.scylla-version.outputs.value }}
          MAVEN_EXTRA_ARGS: ${{ steps.test-skip-args.outputs.value }}
          COVERAGE: "true"
        run: make test-integration-scylla

      - name: Collect coverage execution data
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          mkdir -p coverage-exec
          for exec_file in */target/jacoco.exec metrics/*/target/jacoco.exec; do
            module="${exec_file%/target/jacoco.exec}"
            cp "$exec_file" "coverage-exec/${module//\//-}.exec"
          done
          ls -l coverage-exec

      - name: Upload coverage execution data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-exec-scylla-${{ matrix.scylla-version }}-${{ matrix.java-version }}-${{ matrix.test-group }}
          path: coverage-exec/
          if-no-files-found: warn

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.run-integration-tests.outcome == 'failure'
        with:
          name: test-results-${{ matrix.java-version }}-${{ matrix.scylla-version }}-${{ matrix.test-group }}
          path: "*/**/target/*-reports/*.xml"

      - name: Upload CCM logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ccm-log-scylla-${{ matrix.java-version }}-${{ matrix.scylla-version }}-${{ matrix.test-group }}
          path: /tmp/ccm*/ccm*/node*/logs/*

      - name: Parse test results
        uses: mikepenz/action-junit-report@3585e9575db828022551b4231f165eb59a0e74e3 # v5.6.2
        if: always()
        with:
          check_name: Integration tests report for Scylla ${{ steps.scylla-version.outputs.value }} (${{ matrix.test-group }}, JDK ${{ matrix.java-version }})
          require_tests: true
          report_paths: "*/**/target/*-reports/TEST-*.xml"
          follow_symlink: true
          detailed_summary: true
          updateComment: false
          skip_annotations: true

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: [unit-tests, cassandra-integration-tests, scylla-integration-tests]
    # Runs even when a test lane failed: partial coverage data is still worth
    # reporting, and continue-on-error keeps a flaky integration test from
    # turning this metric into a second failure on the pull request.
    if: ${{ !cancelled() }}
    continue-on-error: true
    timeout-minutes: 20

    # Only needs to read the checkout; same-run artifacts are handled by the
    # Actions runtime token rather than GITHUB_TOKEN. Scoped on this job alone
    # so the existing lanes keep the token permissions their reporting steps
    # rely on.
    permissions:
      contents: read

    env:
      # Overrides the Makefile default of `mvn -B -X -ntp`; this job has nothing
      # to debug and -X buys a log measured in hundreds of megabytes.
      MVNCMD: mvn -B -ntp

    steps:
      - name: Checkout source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-17-maven-${{ hashFiles('**/pom.xml') }}

      - name: Download coverage execution data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-exec-*
          path: coverage-exec

      # jacoco:report-aggregate picks up every *.exec in a module's target
      # directory, so each lane's data only has to land there under a name of
      # its own. The module name was flattened on upload (metrics/micrometer ->
      # metrics-micrometer), so undo that to find the directory again.
      - name: Place execution data next to the classes it was recorded against
        run: |
          shopt -s nullglob
          for lane in coverage-exec/*/; do
            lane_name="$(basename "$lane")"
            for exec_file in "$lane"*.exec; do
              module="$(basename "$exec_file" .exec)"
              if [[ ! -d "$module" && -d "${module/-//}" ]]; then
                module="${module/-//}"
              fi
              mkdir -p "$module/target"
              cp "$exec_file" "$module/target/jacoco-${lane_name#coverage-exec-}.exec"
            done
          done
          find . -name 'jacoco-*.exec' -printf '%p\t%s bytes\n'

      - name: Aggregate coverage
        run: make coverage-report

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage-report/target/site/jacoco-aggregate
          if-no-files-found: error
