name: 'Tests (Driver 4.x) — manual entrypoint'

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      full-suite:
        type: boolean
        description: Run the full two-JDK and Cassandra/Scylla matrix
        default: true
  workflow_call:
    inputs:
      test-ref:
        type: string
        description: Resolved commit to test
        default: ''
      driver-version:
        type: string
        description: Effective version to build and test
        default: ''
      full-suite:
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

# Retain the existing dispatch endpoint while the reusable implementation moves
# to a filename without '@', which GitHub reserves for workflow ref syntax.
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      test-ref: ${{ inputs.test-ref || github.sha }}
      driver-version: ${{ inputs.driver-version || '' }}
      full-suite: ${{ inputs.full-suite }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
