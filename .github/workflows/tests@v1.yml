name: 'Tests (Driver 4.x)'

on:
  push:
    branches: [ scylla-4.*x ]
    paths-ignore:
      - "docs/**"
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs-pr.yml
      - .github/workflows/release.yml
      - "*.md"
      - "*.sh"
      - "renovate.json"
      - ".snyk"
      - ".gitignore"
  pull_request:
    branches: [ scylla-4.*x ]
    paths-ignore:
      - "docs/**"
      - .github/workflows/docs-pages.yml
      - .github/workflows/docs-pr.yml
      - .github/workflows/release.yml
      - "*.md"
      - "*.sh"
      - "renovate.json"
      - ".snyk"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

env:
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      JAVA_VERSION: '8'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@v4
        id: java-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ env.JAVA_VERSION }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.JAVA_VERSION }}-maven-

      - name: Create settings-security.xml
        run: echo '<settingsSecurity/>' > ~/.m2/settings-security.xml

      - name: Install all modules
        run: make install-all
        env:
          MAVEN_OFFLINE_FLAG: ''

      - name: Download test dependencies
        if: steps.java-cache.outputs.cache-hit != 'true'
        run: make download-all-dependencies
        env:
          MAVEN_OFFLINE_FLAG: '' # Override CI offline mode to allow fetching dependencies

      - name: Save maven repository cache
        uses: actions/cache/save@v4
        if: steps.java-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ env.JAVA_VERSION }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Upload build targets
        uses: actions/upload-artifact@v4
        with:
          name: build-targets
          path: |
            */target/
            */*/target/
          retention-days: 3

      - name: Upload scylladb JARs
        uses: actions/upload-artifact@v4
        with:
          name: scylladb-jars
          path: ~/.m2/repository/com/scylladb/
          retention-days: 3

  verify:
    name: Full verify
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10

    env:
      JAVA_VERSION: '8'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@v4
        id: java-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ env.JAVA_VERSION }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Verify maven cache was restored
        if: steps.java-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Maven repository cache was not found. This can happen when the GitHub Actions cache is evicted (10 GB limit per repository). Re-run all jobs (not just failed jobs) so the build job repopulates the cache."
          exit 1

      - name: Download build targets
        uses: actions/download-artifact@v4
        with:
          name: build-targets

      - name: Download scylladb JARs
        uses: actions/download-artifact@v4
        with:
          name: scylladb-jars
          path: ~/.m2/repository/com/scylladb/

      - name: Touch build targets to prevent recompilation
        run: find . -path '*/target/*' -type f -exec touch {} +

      - name: Create settings-security.xml
        run: echo '<settingsSecurity/>' > ~/.m2/settings-security.xml

      - name: Full verify
        run: make check

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10

    env:
      JAVA_VERSION: '8'

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@v4
        id: java-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ env.JAVA_VERSION }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Verify maven cache was restored
        if: steps.java-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Maven repository cache was not found. This can happen when the GitHub Actions cache is evicted (10 GB limit per repository). Re-run all jobs (not just failed jobs) so the build job repopulates the cache."
          exit 1

      - name: Download build targets
        uses: actions/download-artifact@v4
        with:
          name: build-targets

      - name: Download scylladb JARs
        uses: actions/download-artifact@v4
        with:
          name: scylladb-jars
          path: ~/.m2/repository/com/scylladb/

      - name: Touch build targets to prevent recompilation
        run: find . -path '*/target/*' -type f -exec touch {} +

      - name: Create settings-security.xml
        run: echo '<settingsSecurity/>' > ~/.m2/settings-security.xml

      - name: Run unit tests
        run: make test-unit

      - name: Copy test results
        if: always()
        run: |
          shopt -s globstar
          mkdir -p unit
          cp --parents ./**/target/*-reports/*.xml unit/ || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: "*/**/target/*-reports/*.xml"

      - name: Parse test results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          check_name: Unit tests report
          require_tests: true
          report_paths: "*/**/target/*-reports/*.xml"
          follow_symlink: true
          detailed_summary: true
          updateComment: false
          skip_annotations: true

  cassandra-integration-tests:
    name: Cassandra ITs
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 90

    strategy:
      matrix:
        cassandra-version: [3-LATEST, 4-LATEST]
        java-version: [8]
        test-group: [parallelizable, serial, isolated]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@v4
        id: java-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Verify maven cache was restored
        if: steps.java-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Maven repository cache was not found. This can happen when the GitHub Actions cache is evicted (10 GB limit per repository). Re-run all jobs (not just failed jobs) so the build job repopulates the cache."
          exit 1

      - name: Download build targets
        uses: actions/download-artifact@v4
        with:
          name: build-targets

      - name: Download scylladb JARs
        uses: actions/download-artifact@v4
        with:
          name: scylladb-jars
          path: ~/.m2/repository/com/scylladb/

      - name: Touch build targets to prevent recompilation
        run: find . -path '*/target/*' -type f -exec touch {} +

      - name: Create settings-security.xml
        run: echo '<settingsSecurity/>' > ~/.m2/settings-security.xml

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup environment
        run: make install-cassandra-ccm

      - name: Get cassandra version
        id: cassandra-version
        env:
          CASSANDRA_VERSION: ${{ matrix.cassandra-version }}
        run: make resolve-cassandra-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@v4
        id: ccm-cache
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ steps.cassandra-version.outputs.value }}

      - name: Download Cassandra (${{ steps.cassandra-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        env:
          CASSANDRA_VERSION_RESOLVED: ${{ steps.cassandra-version.outputs.value }}
        run: make download-cassandra

      - name: Save CCM image into the cache
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ steps.cassandra-version.outputs.value }}

      - name: Determine test skip args
        id: test-skip-args
        run: |
          case "${{ matrix.test-group }}" in
            parallelizable) echo "value=-DskipSerialITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            serial)         echo "value=-DskipParallelizableITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            isolated)       echo "value=-DskipParallelizableITs=true -DskipSerialITs=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run integration tests on Cassandra (${{ steps.cassandra-version.outputs.value }}) - ${{ matrix.test-group }}
        id: run-integration-tests
        env:
          CASSANDRA_VERSION_RESOLVED: ${{ steps.cassandra-version.outputs.value }}
          MAVEN_EXTRA_ARGS: ${{ steps.test-skip-args.outputs.value }}
        run: make test-integration-cassandra

      - name: Copy test results
        if: steps.run-integration-tests.outcome == 'failure'
        run: |
          shopt -s globstar
          mkdir cassandra-${{ matrix.cassandra-version }}-${{ matrix.test-group }}
          cp --parents ./**/target/*-reports/*.xml cassandra-${{ matrix.cassandra-version }}-${{ matrix.test-group }}/

      - name: Upload test results
        if: steps.run-integration-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.java-version }}-${{ matrix.cassandra-version }}-${{ matrix.test-group }}
          path: "*/**/target/*-reports/*.xml"

      - name: Upload CCM logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ccm-log-cassandra-${{ matrix.java-version }}-${{ matrix.cassandra-version }}-${{ matrix.test-group }}
          path: /tmp/ccm*/ccm*/node*/logs/*

      - name: Parse test results
        uses: mikepenz/action-junit-report@v5
        if: steps.run-integration-tests.outcome != 'skipped'
        with:
          check_name: Integration tests report for Cassandra ${{ steps.cassandra-version.outputs.value }} (${{ matrix.test-group }})
          require_tests: true
          report_paths: "*/**/target/*-reports/*.xml"
          follow_symlink: true
          detailed_summary: true
          updateComment: false
          skip_annotations: true

  scylla-integration-tests:
    name: Scylla ITs
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 90

    strategy:
      matrix:
        scylla-version: [LTS-LATEST, LTS-PRIOR, LATEST]
        java-version: [8]
        test-group: [parallelizable, serial, isolated]
      fail-fast: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Restore maven repository cache
        uses: actions/cache/restore@v4
        id: java-cache
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ matrix.java-version }}-maven-${{ hashFiles('**/pom.xml') }}

      - name: Verify maven cache was restored
        if: steps.java-cache.outputs.cache-hit != 'true'
        run: |
          echo "::error::Maven repository cache was not found. This can happen when the GitHub Actions cache is evicted (10 GB limit per repository). Re-run all jobs (not just failed jobs) so the build job repopulates the cache."
          exit 1

      - name: Download build targets
        uses: actions/download-artifact@v4
        with:
          name: build-targets

      - name: Download scylladb JARs
        uses: actions/download-artifact@v4
        with:
          name: scylladb-jars
          path: ~/.m2/repository/com/scylladb/

      - name: Touch build targets to prevent recompilation
        run: find . -path '*/target/*' -type f -exec touch {} +

      - name: Create settings-security.xml
        run: echo '<settingsSecurity/>' > ~/.m2/settings-security.xml

      - name: Setup Python 3
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install CCM
        run: make install-scylla-ccm

      - name: Get scylla version
        id: scylla-version
        env:
          SCYLLA_VERSION: ${{ matrix.scylla-version }}
        run: make resolve-scylla-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@v4
        id: ccm-cache
        with:
          path: ~/.ccm/scylla-repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Download Scylla (${{ steps.scylla-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        env:
          SCYLLA_VERSION_RESOLVED: ${{ steps.scylla-version.outputs.value }}
        run: make download-scylla

      - name: Save CCM image into the cache
        uses: actions/cache/save@v4
        if: steps.ccm-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.ccm/scylla-repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Determine test skip args
        id: test-skip-args
        run: |
          case "${{ matrix.test-group }}" in
            parallelizable) echo "value=-DskipSerialITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            serial)         echo "value=-DskipParallelizableITs=true -DskipIsolatedITs=true" >> "$GITHUB_OUTPUT" ;;
            isolated)       echo "value=-DskipParallelizableITs=true -DskipSerialITs=true" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run integration tests on Scylla (${{ steps.scylla-version.outputs.value }}) - ${{ matrix.test-group }}
        id: run-integration-tests
        env:
          SCYLLA_VERSION_RESOLVED: ${{ steps.scylla-version.outputs.value }}
          MAVEN_EXTRA_ARGS: ${{ steps.test-skip-args.outputs.value }}
        run: make test-integration-scylla

      - name: Copy test results
        if: steps.run-integration-tests.outcome == 'failure'
        run: |
          shopt -s globstar
          mkdir scylla-${{ matrix.scylla-version }}-${{ matrix.test-group }}
          cp --parents ./**/target/*-reports/*.xml scylla-${{ matrix.scylla-version }}-${{ matrix.test-group }}/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: steps.run-integration-tests.outcome == 'failure'
        with:
          name: test-results-${{ matrix.java-version }}-${{ matrix.scylla-version }}-${{ matrix.test-group }}
          path: "*/**/target/*-reports/*.xml"

      - name: Upload CCM logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ccm-log-scylla-${{ matrix.java-version }}-${{ matrix.scylla-version }}-${{ matrix.test-group }}
          path: /tmp/ccm*/ccm*/node*/logs/*

      - name: Parse test results
        uses: mikepenz/action-junit-report@v5
        if: steps.run-integration-tests.outcome != 'skipped'
        with:
          check_name: Integration tests report for Scylla ${{ steps.scylla-version.outputs.value }} (${{ matrix.test-group }})
          require_tests: true
          report_paths: "*/**/target/*-reports/*.xml"
          follow_symlink: true
          detailed_summary: true
          updateComment: false
          skip_annotations: true
